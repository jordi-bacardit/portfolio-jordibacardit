# Sveltia CMS: the Game Library editor at /administrador (page: src/pages/administrador.astro).
# Projects are not edited here: they live in src/content/projects/ as files.
# Keep these fields in sync with the games schema in src/content.config.ts.
#
# Online: saving commits to GitHub, so only accounts with write access to the repo can change
# content. Sign in with "Sign In with Token": a fine-grained personal access token limited to
# this repository with the "Contents: Read and write" permission.
# Local: open /administrador in Chrome or Edge and choose "Work with Local Repository".
# Docs: https://sveltiacms.app/en/docs

backend:
  name: github
  repo: jordi-bacardit/portfolio-jordibacardit
  branch: main

# Images live in src/assets/ so Astro can optimize them.
media_folder: /src/assets
public_folder: /src/assets

output:
  omit_empty_optional_fields: true

# File names (slugs) in plain ASCII: a title like "Assassin’s Creed" or "Pokémon" must not put
# characters such as ’ or é in the file name, which broke the Netlify build on 2026-10-01.
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: games
    label: Game Library
    label_singular: Game
    description: Games on /game-library, grouped by status.
    folder: src/content/games
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: title
    sortable_fields: [title, status]
    media_folder: /src/assets/games
    public_folder: /src/assets/games
    fields:
      - name: title
        label: Title
        widget: string
      - name: platforms
        label: Platforms
        widget: list
        hint: One platform per row, e.g. PC, PlayStation 5, Nintendo Switch.
      - name: genre
        label: Genre
        widget: string
      - name: status
        label: Status
        widget: select
        options:
          - { label: Playing, value: playing }
          - { label: Played, value: played }
          - { label: Favourite, value: favourite }
          - { label: Formative, value: formative }
      - name: note
        label: My note
        widget: text
        hint: Why this game matters to me. Leave an empty line between paragraphs.
      - name: image
        label: Screenshot
        widget: image
        required: false
        hint: Your own screenshot preferred.
      - name: imageAlt
        label: Screenshot description
        widget: string
        required: false
        hint: What the screenshot shows, for people who can't see it.
